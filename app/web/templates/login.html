{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:380px;margin:60px auto">
  <h1>ログイン</h1>
  {% if error %}<div class="banner err">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next }}">
    <p><label>ユーザー名<br><input name="username" autocomplete="username" required style="width:100%"></label></p>
    <p><label>パスワード<br><input name="password" type="password" autocomplete="current-password" required style="width:100%"></label></p>
    <button style="width:100%">ログイン</button>
  </form>
</div>
{% endblock %}
